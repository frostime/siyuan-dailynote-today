<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Daily Note View · 交互线框</title>
<style>
:root{--bg:#f4f6f8;--panel:#fff;--line:#d9e0e8;--text:#202936;--muted:#66758a;--blue:#276fc2;--soft:#eaf3ff}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px/1.45 system-ui,"Microsoft YaHei",sans-serif}button{font:inherit;cursor:pointer}.page{max-width:1400px;margin:auto;padding:22px}.note{margin-bottom:12px}.note h1{font-size:20px;margin:0}.note p{margin:4px 0;color:var(--muted)}.app{position:relative;height:720px;display:flex;flex-direction:column;overflow:hidden;border:1px solid #bcc9d8;border-radius:10px;background:var(--panel);box-shadow:0 10px 30px #263b5514}.titlebar{height:28px;padding:5px 12px;border-bottom:1px solid var(--line);color:var(--muted);font-size:12px}.toolbar{display:flex;align-items:center;gap:7px;padding:6px 10px;border-bottom:1px solid var(--line);white-space:nowrap}.seg{display:flex;padding:2px;border:1px solid var(--line);border-radius:7px;background:#f7f9fb}.seg button{height:25px;padding:0 10px;border:0;border-radius:5px;color:var(--muted);background:transparent}.seg button.on{color:var(--blue);background:#fff;box-shadow:0 1px 3px #20375220;font-weight:650}.plain,.arrow{height:30px;border:1px solid var(--line);border-radius:6px;color:#445267;background:#fff}.plain{padding:0 10px}.arrow{width:30px}.arrow:disabled{opacity:.3;cursor:not-allowed}.nav{display:flex;align-items:center;gap:4px}.nav-label{min-width:142px;text-align:center;font-weight:650}.spacer{flex:1}.notebook-trigger{flex:0 0 auto}.notebook-panel{position:absolute;z-index:10;top:73px;right:10px;display:none;width:min(380px,calc(100% - 20px));max-height:520px;padding:10px;border:1px solid var(--line);border-radius:9px;background:#fff;box-shadow:0 16px 40px #263b5530}.notebook-panel.open{display:flex;flex-direction:column;gap:8px}.notebook-panel-head{display:flex;align-items:center;justify-content:space-between}.notebook-search{height:32px;padding:0 9px;border:1px solid var(--line);border-radius:6px}.notebook-list{min-height:0;overflow-y:auto}.notebook-row{display:flex;align-items:center;gap:8px;width:100%;padding:8px;border:0;border-radius:6px;color:var(--text);background:#fff;text-align:left}.notebook-row:hover,.notebook-row.on{background:var(--soft)}.notebook-row .mark{width:18px;color:var(--blue)}.notebook-row .name{flex:1}.notebook-row .status{padding:2px 6px;border-radius:999px;color:var(--muted);background:#edf1f5;font-size:11px}.notebook-row.has .status{color:#18764b;background:#e7f6ee}.notebook-row.duplicate .status{color:#a05b17;background:#fff1df}.notebook-panel-actions{display:flex;justify-content:flex-end;gap:7px;padding-top:7px;border-top:1px solid var(--line)}.main{flex:1;min-height:0;display:flex;flex-direction:column;padding:14px;overflow:hidden}.head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:10px}.headline{display:flex;align-items:center;gap:7px;flex-wrap:wrap}.count{padding:2px 7px;border-radius:999px;color:var(--blue);background:var(--soft);font-size:11px}.hint{display:block;margin-top:3px;color:var(--muted);font-size:12px}.tabs{display:flex;gap:4px}.tabs button{padding:3px 7px;border:1px solid var(--line);border-radius:5px;color:var(--muted);background:#fff}.tabs button.on{color:var(--blue);border-color:#9fc2ec;background:var(--soft)}.content{flex:1;min-height:0;overflow:auto}.doc{min-width:0;height:100%;overflow:hidden;border:1px solid var(--line);border-radius:8px;background:#fff}.doc-head{display:flex;justify-content:space-between;padding:8px 10px;border-bottom:1px solid var(--line);font-weight:650}.doc-body{padding:28px}.doc-body h2{font-size:24px;margin:0 0 14px}.doc-body p{color:#4f5e72}.line{height:8px;margin:12px 0;border-radius:8px;background:#e9eef4}.line:nth-child(4){width:68%}.columns{height:100%;display:grid;grid-auto-flow:column;grid-auto-columns:minmax(280px,1fr);gap:10px;overflow-x:auto}.empty{height:100%;display:grid;place-content:center;justify-items:center;text-align:center;color:var(--muted)}.empty strong{color:var(--text)}.empty p{max-width:430px}.create{padding:8px 12px;border:0;border-radius:6px;color:#fff;background:var(--blue)}.calendar{height:100%;overflow:auto;border:1px solid var(--line);border-radius:8px}.calendar-head{display:flex;justify-content:space-between;padding:9px 11px;border-bottom:1px solid var(--line)}.cal-grid{display:grid;grid-template-columns:repeat(7,1fr)}.dow,.day{min-height:82px;padding:7px;border-right:1px solid var(--line);border-bottom:1px solid var(--line)}.dow{min-height:auto;color:var(--muted);background:#f7f9fb;text-align:center}.day{cursor:pointer}.day:hover{background:#f8fbff}.day.dim{opacity:.35}.tag{display:block;width:100%;margin-top:4px;padding:3px 5px;overflow:hidden;border:0;border-radius:4px;color:var(--blue);background:var(--soft);text-align:left;text-overflow:ellipsis;white-space:nowrap}.year{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;padding:14px}.month{height:105px;border:1px solid var(--line);border-radius:8px;color:var(--text);background:#fff;font-size:16px}.month:hover{color:var(--blue);border-color:#9fc2ec;background:var(--soft)}.fab{position:absolute;right:15px;bottom:15px;z-index:6;display:none;height:38px;padding:0 13px;border:1px solid #9fc2ec;border-radius:19px;color:var(--blue);background:#fff;box-shadow:0 7px 20px #263b5525}.fab.show{display:block}.context{position:absolute;right:15px;bottom:60px;z-index:6;display:none;padding:8px;border:1px solid var(--line);border-radius:8px;background:#fff;box-shadow:0 12px 28px #263b5525}.context.open{display:block}.dialog-backdrop{position:absolute;inset:0;z-index:12;display:none;place-items:center;background:#1d2b3a30}.dialog-backdrop.open{display:grid}.dialog{width:430px;padding:16px;border:1px solid var(--line);border-radius:10px;background:#fff;box-shadow:0 18px 50px #263b5535}.dialog h3{margin:0}.dialog p{margin:3px 0 12px;color:var(--muted)}.dialog-row{display:flex;align-items:center;gap:8px;padding:8px 0;border-top:1px solid var(--line)}.dialog-row span:first-child{flex:1}.dialog-row small{color:var(--muted)}.dialog-actions{display:flex;justify-content:flex-end;margin-top:12px}.loading{opacity:.65}@media(max-width:950px){body{min-width:850px}.page{padding:10px}.app{height:650px}.toolbar{overflow-x:auto}.year{grid-template-columns:repeat(2,1fr)}}
</style>
</head>
<body>
<div class="page">
<header class="note"><h1>Daily Note View · 最小交互线框</h1><p>只验证“当前在看什么、箭头移动什么、何时允许创建”。不是视觉稿，也不是组件实现模板。</p></header>
<section class="app">
  <div class="titlebar">● ● ●　思源 · Daily Note View</div>
  <div class="toolbar">
    <div class="seg" id="modeSeg"><button data-mode="content">内容</button><button data-mode="calendar">日历</button></div>
    <div class="nav"><button class="arrow" id="prev">‹</button><span class="nav-label" id="navLabel"></span><button class="arrow" id="next">›</button></div>
    <div class="seg" id="groupSeg"><button data-group="day" title="固定日期，查看所选笔记本">单日</button><button data-group="sequence" title="固定笔记本，前后浏览日期">时间轴</button></div>
    <span class="spacer"></span>
    <button class="plain notebook-trigger" id="notebookFab">笔记状态</button>
  </div>
  <main class="main" id="main"></main>
  <div class="notebook-panel" id="notebookPanel"></div>
  <button class="fab" id="fab"></button>
  <div class="context" id="context"></div>
  <div class="dialog-backdrop" id="dialogBackdrop"><section class="dialog" id="dialog"></section></div>
</section>
</div>
<script>
const books=[{id:'work',name:'工作笔记'},{id:'personal',name:'个人'},{id:'alpha',name:'项目 Alpha'},{id:'reading',name:'阅读'}];
let docs=[
{id:1,book:'work',date:'2026-07-02',title:'一个神奇的 BUG',text:'记录问题、线索和下一步。'},
{id:2,book:'personal',date:'2026-07-02',title:'晨间记录',text:'今天需要保持专注。'},
{id:3,book:'work',date:'2026-07-05',title:'修复记录',text:'验证修改并整理结果。'},
{id:4,book:'work',date:'2026-07-18',title:'迭代回顾',text:'回看本轮交付与遗留事项。'},
{id:5,book:'work',date:'2026-07-30',title:'月底总结',text:'本月完成的事情。'},
{id:6,book:'personal',date:'2026-07-07',title:'散步',text:'傍晚的风很舒服。'}
];
const state={mode:'content',daySelectMode:'multi',draftSelectMode:'multi',dayBooks:['work','personal'],draftDayBooks:[],sequenceBook:'work',date:'2026-07-02',group:'day',selected:1,columnCount:3,existingOnly:false,scale:'month',context:false,notebookOpen:false};
const $=s=>document.querySelector(s), $$=s=>document.querySelectorAll(s);
const bookName=id=>books.find(b=>b.id===id)?.name||id;
const addDays=(value,n)=>{const d=new Date(value+'T00:00:00');d.setDate(d.getDate()+n);return d.toISOString().slice(0,10)};
const seq=()=>docs.filter(d=>d.book===state.sequenceBook).sort((a,b)=>a.date.localeCompare(b.date));
function seqIndex(){const list=seq();let i=list.findIndex(d=>d.date===state.date);if(i>=0)return i;i=list.findIndex(d=>d.date>=state.date);return i>=0?i:Math.max(0,list.length-1)}
function dayDocs(){return docs.filter(d=>d.date===state.date&&state.dayBooks.includes(d.book))}
function dayItems(){return state.dayBooks.map(book=>docs.find(d=>d.date===state.date&&d.book===book)||{missing:true,book,date:state.date})}
function sequenceCount(){return state.columnCount}
function existingStart(){const list=seq(),count=sequenceCount(),max=Math.max(0,list.length-count);return Math.min(seqIndex(),max)}
function sequenceItems(){const count=sequenceCount();if(state.existingOnly)return seq().slice(existingStart(),existingStart()+count);return Array.from({length:count},(_,i)=>{const date=addDays(state.date,i);return docs.find(d=>d.book===state.sequenceBook&&d.date===date)||{missing:true,book:state.sequenceBook,date}})}
function visible(){return state.group==='day'?dayItems():sequenceItems()}
function docMarkup(d){return `<article class="doc"><header class="doc-head"><span>${bookName(d.book)}</span><span>${d.date}</span></header><div class="doc-body"><h2>${d.title}</h2><p>${d.text}</p><div class="line"></div><div class="line"></div><div class="line"></div></div></article>`}
function missingMarkup(item){const [y,m]=item.date.split('-');return `<article class="doc"><header class="doc-head"><span>${bookName(item.book)}　/　${item.date}</span><span class="count">未创建</span></header><div class="empty"><strong>未创建</strong><code>/daily note/${y}/${m}/${item.date}</code><button class="create direct-create" data-date="${item.date}" data-book="${item.book}">+ 创建 Daily Note</button><p>浏览不会创建文档；只有点击按钮才写入。</p></div></article>`}
function periodLabel(){
 if(state.mode==='calendar'){if(state.scale==='year')return state.date.slice(0,4)+' 年';if(state.scale==='month')return state.date.slice(0,7);return state.date+' 所在周'}
 if(state.group==='day')return state.date;
 const shown=visible();if(!shown.length)return '没有日记';return shown.length<2?shown[0].date:`${shown[0].date} ~ ${shown.at(-1).date}`
}
function renderContent(){
 const all=state.group==='day'?dayDocs():seq(),shown=visible();
 const title=state.group==='day'?state.date:'时间轴';
 const created=shown.filter(d=>!d.missing).length;
 const count=state.group==='day'?`${created} / ${shown.length} 已创建`:state.existingOnly?`${all.length} 篇已有日记`:`${created} / ${shown.length} 已创建`;
 const hint=state.group==='day'?'同一天实际存在的日记':state.existingOnly?'跳过未创建日期，按已有日记移动':'保留连续自然日，未创建日期仍占一个栏位';
 let body='';
 if(state.group==='sequence'&&state.existingOnly&&!all.length)body=`<div class="empty"><strong>这个笔记本还没有日记</strong><p>切换到“逐日”后，可选择日期并直接创建。</p></div>`;
 else body=`<div class="columns">${shown.map(item=>item.missing?missingMarkup(item):docMarkup(item)).join('')}</div>`;
 return `<header class="head"><div><div class="headline"><strong>${title}</strong><span class="count">${count}</span></div><span class="hint">${hint}</span></div></header><div class="content">${body}</div>`
}
function monthGrid(){const y=+state.date.slice(0,4),m=+state.date.slice(5,7)-1,first=new Date(y,m,1),days=new Date(y,m+1,0).getDate(),offset=(first.getDay()+6)%7;let cells=['一','二','三','四','五','六','日'].map(x=>`<div class="dow">${x}</div>`).join('')+'<div class="day dim"></div>'.repeat(offset);for(let n=1;n<=days;n++){const date=`${y}-${String(m+1).padStart(2,'0')}-${String(n).padStart(2,'0')}`,items=docs.filter(d=>d.date===date);cells+=`<div class="day" data-date="${date}"><b>${n}</b>${items.map(d=>`<button class="tag" data-doc="${d.id}">${bookName(d.book)} · ${d.title}</button>`).join('')}</div>`}return `<div class="cal-grid">${cells}</div>`}
function weekGrid(){const base=new Date(state.date+'T00:00:00'),day=base.getDay()||7;base.setDate(base.getDate()-day+1);let cells=['一','二','三','四','五','六','日'].map(x=>`<div class="dow">${x}</div>`).join('');for(let n=0;n<7;n++){const d=new Date(base);d.setDate(base.getDate()+n);const date=d.toISOString().slice(0,10),items=docs.filter(x=>x.date===date);cells+=`<div class="day" data-date="${date}"><b>${date.slice(5)}</b>${items.map(x=>`<button class="tag" data-doc="${x.id}">${bookName(x.book)} · ${x.title}</button>`).join('')}</div>`}return `<div class="cal-grid">${cells}</div>`}
function renderCalendar(){let body;if(state.scale==='year')body=`<div class="year">${Array.from({length:12},(_,i)=>`<button class="month" data-month="${i+1}">${i+1} 月</button>`).join('')}</div>`;else body=state.scale==='week'?weekGrid():monthGrid();return `<div class="calendar"><header class="calendar-head"><strong>${state.scale==='week'?'周':state.scale==='month'?'月':'年'}视图</strong><span>${state.scale==='year'?'点击月份进入月视图':'显示全部笔记本；点击日期查看打开或创建操作'}</span></header>${body}</div>`}
function notebookState(book){if(state.group==='sequence'){const count=docs.filter(d=>d.book===book).length;return {text:`${count} 篇`,kind:count?'has':'missing'}}const count=docs.filter(d=>d.book===book&&d.date===state.date).length;return count>1?{text:`重复 ${count}`,kind:'duplicate'}:count===1?{text:'已有',kind:'has'}:{text:'未创建',kind:'missing'}}
function notebookSummary(){if(state.group==='sequence'){const status=notebookState(state.sequenceBook);return `笔记状态 · ${bookName(state.sequenceBook)} · ${status.text}`}if(state.daySelectMode==='single'){const book=state.dayBooks[0],status=notebookState(book);return `笔记状态 · ${bookName(book)} · ${status.text}`}const withDocs=state.dayBooks.filter(book=>notebookState(book).kind!=='missing').length;return `笔记状态 · ${state.dayBooks.length} 选 / ${withDocs} 有`}
function renderNotebookPanel(){const available=state.mode==='content';$('#notebookFab').style.display=available?'block':'none';if(!available){state.notebookOpen=false;$('#notebookPanel').classList.remove('open');return}$('#notebookFab').textContent=notebookSummary();$('#notebookPanel').classList.toggle('open',state.notebookOpen);if(!state.notebookOpen)return;const day=state.group==='day',multi=day&&state.draftSelectMode==='multi',selected=book=>day?(multi?state.draftDayBooks.includes(book):state.dayBooks[0]===book):state.sequenceBook===book;const mode=day?`<div class="seg"><button data-select-mode="single" class="${state.draftSelectMode==='single'?'on':''}">单选</button><button data-select-mode="multi" class="${state.draftSelectMode==='multi'?'on':''}">多选</button></div>`:`<small>时间轴 · 单选</small>`;const rows=books.map(book=>{const status=notebookState(book.id),on=selected(book.id);return `<button class="notebook-row ${on?'on':''} ${status.kind}" data-notebook="${book.id}" data-name="${book.name.toLowerCase()}"><span class="mark">${day?(multi?(on?'☑':'☐'):'○'):'○'}</span><span class="name">${book.name}</span><span class="status">${status.text}</span></button>`}).join('');$('#notebookPanel').innerHTML=`<div class="notebook-panel-head"><strong>显示笔记状态</strong>${mode}</div><input class="notebook-search" id="notebookSearch" placeholder="搜索笔记本…"><div class="notebook-list">${rows}</div>${multi?`<div class="notebook-panel-actions"><button class="plain" data-notebook-cancel>取消</button><button class="create" data-notebook-apply>应用</button></div>`:''}`;bindNotebookPanel()}
function bindNotebookPanel(){const search=$('#notebookSearch');if(search)search.oninput=()=>{$$('.notebook-row').forEach(row=>row.style.display=row.dataset.name.includes(search.value.trim().toLowerCase())?'flex':'none')};$('#notebookPanel').onclick=e=>{const mode=e.target.closest('[data-select-mode]')?.dataset.selectMode,id=e.target.closest('[data-notebook]')?.dataset.notebook;if(mode){state.draftSelectMode=mode;if(mode==='multi'){const existing=books.map(b=>b.id).filter(book=>docs.some(d=>d.book===book&&d.date===state.date));state.draftDayBooks=existing.length?existing:[state.dayBooks[0]||books[0].id]}renderNotebookPanel();return}if(id){if(state.group==='day'&&state.draftSelectMode==='multi'){const on=state.draftDayBooks.includes(id);if(on&&state.draftDayBooks.length===1)return;state.draftDayBooks=on?state.draftDayBooks.filter(x=>x!==id):books.map(b=>b.id).filter(x=>state.draftDayBooks.includes(x)||x===id);renderNotebookPanel()}else if(state.group==='day'){state.daySelectMode='single';state.dayBooks=[id];state.notebookOpen=false;render()}else{state.sequenceBook=id;state.notebookOpen=false;render()}return}if(e.target.closest('[data-notebook-apply]')){state.daySelectMode='multi';state.dayBooks=[...state.draftDayBooks];state.notebookOpen=false;render()}if(e.target.closest('[data-notebook-cancel]')){state.notebookOpen=false;renderNotebookPanel()}}}
function renderContext(){const sequence=state.mode==='content'&&state.group==='sequence',show=state.mode==='calendar'||sequence;$('#fab').classList.toggle('show',show);$('#context').classList.toggle('open',show&&state.context);if(!show){state.context=false;return}if(state.mode==='calendar'){const names={week:'周',month:'月',year:'年'};$('#fab').textContent=names[state.scale];$('#context').innerHTML=`<div class="seg">${Object.entries(names).map(([k,v])=>`<button data-scale="${k}" class="${state.scale===k?'on':''}">${v}</button>`).join('')}</div>`;return}$('#fab').textContent=`${state.existingOnly?'仅已有':'逐日'} · ${state.columnCount} 日`;$('#context').innerHTML=`<div class="seg"><button data-filter="all" title="保留没有日记的日期" class="${!state.existingOnly?'on':''}">逐日</button><button data-filter="existing" title="跳过没有日记的日期" class="${state.existingOnly?'on':''}">仅已有</button></div><div class="seg">${[1,2,3,5].map(n=>`<button data-cols="${n}" class="${state.columnCount===n?'on':''}">${n}</button>`).join('')}</div>`}
function render(){
 $$('#modeSeg button').forEach(b=>b.classList.toggle('on',b.dataset.mode===state.mode));$('#groupSeg').style.display=state.mode==='content'?'flex':'none';$$('#groupSeg button').forEach(b=>b.classList.toggle('on',b.dataset.group===state.group));
 renderNotebookPanel();$('#navLabel').textContent=periodLabel();
 $('#prev').style.display='block';$('#next').style.display='block';if(state.mode==='content'&&state.group==='sequence'&&state.existingOnly){const start=existingStart(),max=Math.max(0,seq().length-sequenceCount());$('#prev').disabled=start<=0;$('#next').disabled=start>=max}else{$('#prev').disabled=false;$('#next').disabled=false}
 $('#main').innerHTML=state.mode==='content'?renderContent():renderCalendar();renderContext();bindDynamic();
}
function openDocument(doc){state.mode='content';state.group='day';state.daySelectMode='single';state.dayBooks=[doc.book];state.date=doc.date;state.selected=doc.id;$('#dialogBackdrop').classList.remove('open');render()}
function openDayDialog(date){const rows=books.map(({id:book})=>{const doc=docs.find(d=>d.book===book&&d.date===date);return `<div class="dialog-row"><span><b>${bookName(book)}</b><small>　${doc?'已有日记':'未创建'}</small></span>${doc?`<button class="plain" data-dialog-open="${doc.id}">打开</button>`:`<button class="create" data-dialog-create="${book}" data-date="${date}">创建</button>`}</div>`}).join('');$('#dialog').innerHTML=`<h3>${date}</h3><p>日期已经确定；以下为全部笔记本。</p>${rows}<div class="dialog-actions"><button class="plain" id="closeDialog">关闭</button></div>`;$('#dialogBackdrop').classList.add('open');$$('[data-dialog-open]').forEach(button=>button.onclick=()=>openDocument(docs.find(d=>d.id===+button.dataset.dialogOpen)));$$('[data-dialog-create]').forEach(button=>button.onclick=()=>{const id=Math.max(...docs.map(d=>d.id))+1,book=button.dataset.dialogCreate;docs.push({id,book,date,title:'新建日记',text:'已从日历按当前日期和笔记本创建。'});openDocument(docs.find(d=>d.id===id))});$('#closeDialog').onclick=()=>$('#dialogBackdrop').classList.remove('open')}
function shift(n){if(state.mode==='calendar'){if(state.scale==='year'){state.date=String(+state.date.slice(0,4)+n)+'-01-01'}else if(state.scale==='month'){const d=new Date(state.date+'T00:00:00');d.setMonth(d.getMonth()+n,1);state.date=d.toISOString().slice(0,10)}else state.date=addDays(state.date,n*7)}else if(state.group==='day'||!state.existingOnly)state.date=addDays(state.date,n);else{const list=seq(),target=list[existingStart()+n];if(target){state.date=target.date;state.selected=target.id}}render()}
function bindDynamic(){
 $$('.direct-create').forEach(button=>button.onclick=e=>{const btn=e.currentTarget,date=btn.dataset.date,book=btn.dataset.book;btn.disabled=true;btn.textContent='创建中…';setTimeout(()=>{const id=Math.max(...docs.map(d=>d.id))+1;docs.push({id,book,date,title:'新建日记',text:'已按该栏日期和笔记本直接创建。'});state.selected=id;render()},450)});
 $$('[data-doc]').forEach(b=>b.onclick=e=>{e.stopPropagation();const d=docs.find(x=>x.id===+b.dataset.doc);openDocument(d)});
 $$('.day[data-date]').forEach(d=>d.onclick=e=>{if(e.target.closest('[data-doc]'))return;openDayDialog(d.dataset.date)});$$('[data-month]').forEach(b=>b.onclick=()=>{state.scale='month';state.date=`${state.date.slice(0,4)}-${String(b.dataset.month).padStart(2,'0')}-01`;render()});
 $$('[data-scale]').forEach(b=>b.onclick=()=>{state.scale=b.dataset.scale;state.context=false;render()});$$('[data-cols]').forEach(b=>b.onclick=()=>{state.columnCount=+b.dataset.cols;state.context=false;render()});$$('[data-filter]').forEach(b=>b.onclick=()=>{state.existingOnly=b.dataset.filter==='existing';state.context=false;render()});
}
$('#dialogBackdrop').onclick=e=>{if(e.target===e.currentTarget)e.currentTarget.classList.remove('open')};$('#modeSeg').onclick=e=>{if(e.target.dataset.mode){state.mode=e.target.dataset.mode;state.context=false;render()}};$('#groupSeg').onclick=e=>{if(e.target.dataset.group){state.group=e.target.dataset.group;state.context=false;render()}};$('#notebookFab').onclick=()=>{state.notebookOpen=!state.notebookOpen;state.context=false;if(state.notebookOpen){state.draftSelectMode=state.daySelectMode;state.draftDayBooks=[...state.dayBooks]}renderNotebookPanel();renderContext()};$('#prev').onclick=()=>shift(-1);$('#next').onclick=()=>shift(1);$('#fab').onclick=()=>{state.context=!state.context;state.notebookOpen=false;renderContext();renderNotebookPanel();bindDynamic()};render();
</script>
</body>
</html>
